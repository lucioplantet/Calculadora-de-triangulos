kind = "web"
previewPath = "/triangulacion/"
title = "Calculadora de Triangulación de Terrenos"
version = "1.0.0"
id = "artifacts/triangulacion"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/triangulacion/" ]
localPort = 23791

[services.development]
run = "pnpm --filter @workspace/triangulacion run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/triangulacion", "run", "build" ]
publicDir = "artifacts/triangulacion/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23791"
BASE_PATH = "/triangulacion/"
